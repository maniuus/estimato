appId: com.abimanyu.estimato
productName: Estimato
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
compression: maximum
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Estimato
  artifactName: Estimato-${version}-Setup.${ext}
electronLanguages:
  - en-US
  - id